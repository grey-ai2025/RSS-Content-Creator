      - text: Task automation doesn’t equal job loss. Most roles will remain—but will change substantially.
      - list [ref=e35]:
        - listitem [ref=e36]: Our microeconomic model reveals that over the next two to three years, 50% to 55% of jobs in the US will be reshaped by AI.
