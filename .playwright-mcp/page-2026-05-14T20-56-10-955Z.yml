  - main [ref=e39]:
    - generic [ref=e40]:
      - paragraph [ref=e41]:
        - text: Over the next two to three years, 50% to 55% of jobs in the US will be reshaped by
        - link "AI" [ref=e42] [cursor=pointer]:
          - /url: https://www.bcg.com/capabilities/artificial-intelligence
        - text: . For many employees, this will mean that they retain the same or a similar role but face radically new expectations for how they work and what they produce. For company leaders, it will require a clear vision for how the transformation is managed, including a scaled, strategic approach to upskilling and reskilling and the restructuring of career ladders.
      - paragraph [ref=e43]:
        - text: This shift is already happening—
        - link "and will pick up speed as AI adoption spreads" [ref=e44] [cursor=pointer]:
          - /url: https://www.bcg.com/publications/2025/ai-is-outpacing-your-workforce-strategy-are-you-ready
        - text: . Our analysis, based on microeconomic modeling, identified a significant swath of the labor force for which AI will meaningfully augment current roles. Moreover, when the productivity gains from AI use trigger increased end product demand and the potential for augmentation is high, we believe there will be a need for more and, in some cases, new human roles. (See Exhibit 1.) While job augmentation and new-job creation will happen rapidly, full substitution of jobs by AI will be slower. Five years from now—or perhaps further in the future—10% to 15% of jobs in the US could be eliminated.
        - superscript [ref=e47] [cursor=pointer]: "1"
        - text: This level of potential job loss is considerable and creates an important call to action for business leaders.
      - figure [ref=e49]:
        - img "Two Critical Factors in AI's Impact Are Labor Substitution and Demand Expandability" [ref=e51]
      - paragraph [ref=e52]:
        - text: Critically, our analysis is not intended to be an unemployment forecast. It does not account for macroeconomic factors such as
        - link "geopolitics" [ref=e53] [cursor=pointer]:
          - /url: https://www.bcg.com/capabilities/international-business/center-for-geopolitics
        - text: or inflation, nor does it contemplate the impact of new AI breakthroughs beyond the capabilities of today’s frontier models. Moreover, our model can’t solve for powerful and influential unknowns, such as the future impact of AI on the accessibility of jobs and the speed with which the
        - link "technology" [ref=e54] [cursor=pointer]:
          - /url: https://www.bcg.com/capabilities/digital-technology-data/overview
        - text: "is adopted. (See “Methodology: Translating Automation Potential into Labor Market Outcomes” for more on our approach.)"
      - group [ref=e58]:
        - 'generic "Methodology: Translating Automation Potential into Labor Market Outcomes" [ref=e59] [cursor=pointer]'
      - paragraph [ref=e60]:
        - text: That said, the analysis provides clear guidance for
        - link "CEOs" [ref=e61] [cursor=pointer]:
          - /url: https://www.bcg.com/executives/ceo-agenda
        - text: on how to act in the face of this workforce shift. They are making decisions today that affect their people and the viability of their business, and they need a nuanced view of AI’s impact. Those who cut their workforce beyond AI’s ability to replace it will see productivity drop, institutional knowledge disappear, and critical talent walk away. Those who fail to dramatically rethink work will see their competitors grow faster and more profitably.
